name: Validate catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test validation rules
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Run synthetic SQLite walkthroughs
        run: python examples/run.py --check
      - name: Validate source records and public content
        run: python scripts/validate.py
      - name: Verify generated views
        run: python scripts/render.py --check
